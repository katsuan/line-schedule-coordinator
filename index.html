<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程調整</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --primary: #4F46E5;
    --text: #111111;
    --sub-text: #8C8C8C;
    --border: #EEEEEE;
    --bg: #FAFAFA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    background: #fff;
  }
  h1 { font-size: 1.25rem; margin: 8px 0; }
  h2 { font-size: 1rem; color: var(--sub-text); margin: 20px 0 8px; }
  .page-header { margin-bottom: 16px; }
  .header-actions { display: flex; gap: 8px; margin-top: 10px; }
  .header-actions .btn { flex: 1; margin-top: 0; width: auto; text-align: center; }
  .btn-back { color: var(--sub-text); text-decoration: none; font-size: 0.85rem; }
  .btn {
    display: inline-block;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    width: 100%;
    text-align: center;
    margin-top: 12px;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-danger {
    width: 100%;
    text-align: center;
    margin-top: 8px;
    color: #D93025;
    border-color: #F3D4D1;
    background: #FDF3F2;
  }
  form label {
    display: block;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--sub-text);
  }
  form input[type="text"], form input[type="datetime-local"], form textarea {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    color: var(--text);
  }
  .option-range { display: flex; gap: 8px; }
  .option-sublabel { flex: 1; font-size: 0.7rem; color: var(--sub-text); margin-bottom: 0; }
  .option-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    background: var(--bg);
  }
  .option-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .option-card-icon { font-size: 1.1rem; flex-shrink: 0; }
  .option-card-head .option-title {
    flex: 1;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    background: transparent;
    padding: 4px 2px;
    font-weight: bold;
  }
  .btn-remove-option {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--sub-text);
    cursor: pointer;
  }
  .option-location {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    background: #fff;
  }
  .event-row { list-style: none; }
  .event-row a {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
  }
  .event-meta { color: var(--sub-text); font-size: 0.8rem; }
  .tab-bar {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: none;
    color: var(--sub-text);
    font-size: 0.85rem;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--primary); font-weight: bold; }
  .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 9px;
    background: var(--border);
    color: var(--text);
    font-size: 0.7rem;
  }
  .tab-btn.active .tab-count { background: var(--primary); color: #fff; }
  ul { padding: 0; margin: 0; }
  .empty { color: var(--sub-text); text-align: center; margin-top: 40px; }
  .answer-row, .summary-row {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fff;
  }
  .answer-row.readonly { background: var(--bg); }
  .option-meta { margin-bottom: 10px; }
  .option-meta-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .option-meta-title { font-weight: bold; font-size: 0.95rem; }
  .edit-option-btn {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 2px 4px;
  }
  .option-edit-form { margin-top: 8px; }
  .option-edit-actions { display: flex; gap: 8px; margin-top: 8px; }
  .option-edit-actions .btn { flex: 1; }
  .option-meta-date { color: var(--sub-text); font-size: 0.8rem; margin-top: 2px; }
  .option-meta-location { color: var(--sub-text); font-size: 0.8rem; margin-top: 2px; }
  .answer-choices { display: flex; gap: 10px; }
  .answer-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: bold;
    color: #fff;
    background: #B0B0B0;
    flex-shrink: 0;
  }
  .answer-icon.choice-ok { background: #2D8A4E; }
  .answer-icon.choice-maybe { background: #E8A33D; }
  .answer-icon.choice-ng { background: #D93025; }
  .summary-counts span { display: inline-flex; align-items: center; gap: 4px; }
  .respondent.me .avatar { outline: 2px solid var(--primary); outline-offset: 1px; }
  .respondent.me span:last-child { font-weight: bold; }
  .summary-counts { display: flex; gap: 16px; margin: 8px 0 4px; font-size: 0.9rem; }
  .my-answer-highlight {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .my-answer-label { font-size: 0.8rem; font-weight: bold; color: var(--text); }
  .my-answer-highlight .answer-icon { width: 28px; height: 28px; font-size: 0.9rem; }
  details summary { font-size: 0.8rem; color: var(--sub-text); cursor: pointer; }
  .remind-btn {
    border: none;
    background: none;
    color: var(--primary);
    font-size: 0.7rem;
    text-decoration: underline;
    cursor: pointer;
    align-self: center;
  }
  .cal-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: var(--sub-text);
    text-decoration: none;
    width: fit-content;
  }
  .cal-link:hover { color: var(--text); }
  .loading, .error { text-align: center; color: var(--sub-text); margin-top: 40px; }
  .event-description { color: var(--sub-text); font-size: 0.9rem; white-space: pre-wrap; }
  section { margin-bottom: 24px; }
  .respondent-label { font-size: 0.75rem; color: var(--sub-text); margin: 8px 0 4px; }
  .respondent-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .respondent { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; width: 48px; }
  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-color: var(--border);
    background-size: cover;
    background-position: center;
    color: var(--sub-text);
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .empty-respondents { color: var(--sub-text); font-size: 0.8rem; margin: 4px 0; }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 40px; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-tip {
    max-width: 280px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--sub-text);
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 6px;
  }
  .choice-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    color: var(--sub-text);
  }
  .choice-ok { border-color: #B7E4C7; color: #2D8A4E; }
  .choice-ok.selected { background: #2D8A4E; border-color: #2D8A4E; color: #fff; }
  .choice-maybe { border-color: #FFE1A8; color: #C9862B; }
  .choice-maybe.selected { background: #E8A33D; border-color: #E8A33D; color: #fff; }
  .choice-ng { border-color: #F3C6C1; color: #D93025; }
  .choice-ng.selected { background: #D93025; border-color: #D93025; color: #fff; }
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
  .cal-month-label { font-weight: bold; min-width: 90px; text-align: center; }
  .cal-grid-header, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-weekday { text-align: center; font-size: 0.7rem; color: var(--sub-text); padding: 4px 0; }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border-radius: 8px;
    cursor: default;
  }
  .cal-cell.has-items { cursor: pointer; background: var(--bg); }
  .cal-cell.today .cal-daynum {
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-daynum { font-size: 0.8rem; }
  .cal-dots { display: flex; gap: 2px; min-height: 6px; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .cal-dot.dot-ok { background: #2D8A4E; }
  .cal-dot.dot-maybe { background: #E8A33D; }
  .cal-dot.dot-ng { background: #D93025; }
  .cal-dot.dot-none { background: #B0B0B0; }
  .cal-pills { display: flex; flex-direction: column; gap: 1px; align-items: center; min-height: 12px; }
  .cal-pill {
    font-size: 0.5rem;
    line-height: 1.4;
    padding: 0 3px;
    border-radius: 5px;
    background: var(--border);
    color: var(--text);
    white-space: nowrap;
  }
  .cal-pill.dot-ok { background: #E9F7EF; color: #2D8A4E; }
  .cal-pill.dot-maybe { background: #FFF6E5; color: #C9862B; }
  .cal-pill.dot-ng { background: #FDEDEB; color: #D93025; }
  .cal-pill.dot-none { background: #EEEEEE; color: #8C8C8C; }
  .cal-pill-more { font-size: 0.5rem; color: var(--sub-text); }
  .cal-item-list { margin-top: 8px; }
  .cal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
  }
  .cal-item .cal-dot { width: 10px; height: 10px; flex-shrink: 0; }
  .cal-item-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .cal-item-title { font-weight: bold; font-size: 0.9rem; }
  .cal-item-date { font-size: 0.75rem; color: var(--sub-text); }
  .cal-item-status { font-size: 0.75rem; color: var(--sub-text); flex-shrink: 0; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-box {
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 16px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-close { border: none; background: none; font-size: 1.3rem; cursor: pointer; color: var(--sub-text); }
  .flex-preview {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: var(--bg);
  }
  .flex-preview-line { margin: 4px 0; font-size: 0.85rem; }
  .flex-preview-sep { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .preview-comment-label {
    display: block;
    margin-top: 12px;
    font-size: 0.8rem;
    color: var(--sub-text);
  }
  .preview-comment-input {
    width: 100%;
    margin-top: 4px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
  }
</style>
</head>
<body>
<div id="app">
  <div class="loading" style="margin-top:80px">
    <span class="spinner"></span>
    <span>読み込み中...</span>
  </div>
</div>
<script src="js/util.js"></script>
<script>
  document.getElementById('app').innerHTML = AppUtil.loadingHtml();
</script>
<script src="js/config.js"></script>
<script src="js/platform.js"></script>
<script src="js/api.js"></script>
<script src="js/router.js"></script>
<script src="js/share.js"></script>
<script src="js/views/list.js"></script>
<script src="js/views/create.js"></script>
<script src="js/views/detail.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
