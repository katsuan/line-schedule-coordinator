<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程調整</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --primary: #4F46E5;
    --text: #111111;
    --sub-text: #8C8C8C;
    --border: #EEEEEE;
    --bg: #FAFAFA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    background: #fff;
  }
  h1 { font-size: 1.25rem; margin: 8px 0; }
  h2 { font-size: 1rem; color: var(--sub-text); margin: 20px 0 8px; }
  .page-header { margin-bottom: 16px; }
  .header-actions { display: flex; gap: 8px; margin-top: 10px; }
  .header-actions .btn { flex: 1; margin-top: 0; width: auto; text-align: center; }
  .btn-back { color: var(--sub-text); text-decoration: none; font-size: 0.85rem; }
  .btn {
    display: inline-block;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    width: 100%;
    text-align: center;
    margin-top: 12px;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-danger {
    width: 100%;
    text-align: center;
    margin-top: 8px;
    color: #D93025;
    border-color: #F3D4D1;
    background: #FDF3F2;
  }
  .fixed-share-bar-spacer { height: 76px; }
  .fixed-share-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 480px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    z-index: 10;
  }
  .fixed-share-bar .btn-primary { margin-top: 0; }
  form label {
    display: block;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--sub-text);
  }
  form input[type="text"], form input[type="datetime-local"], form textarea {
    display: block;
    width: 100%;
    min-width: 0;
    margin-top: 4px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    color: var(--text);
  }
  .option-range { display: flex; gap: 8px; min-width: 0; }
  .option-sublabel { flex: 1; min-width: 0; font-size: 0.7rem; color: var(--sub-text); margin-bottom: 0; }
  .option-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    background: var(--bg);
  }
  .option-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .option-card-icon { font-size: 1.1rem; flex-shrink: 0; }
  .option-card-head .option-title {
    flex: 1;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    background: transparent;
    padding: 4px 2px;
    font-weight: bold;
  }
  .btn-remove-option {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--sub-text);
    cursor: pointer;
  }
  .option-location {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    background: #fff;
  }
  .event-row { list-style: none; }
  .event-row a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
  }
  .event-row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .status-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .status-badge.status-answered { background: #E9F7EF; color: #2D8A4E; }
  .status-badge.status-pending { background: #FDEDEB; color: #D93025; }
  .status-badge.status-creator { background: #EEF0FF; color: #4F46E5; }
  .status-badge.status-common { background: #F0F0F0; color: var(--sub-text); }
  .event-meta { color: var(--sub-text); font-size: 0.8rem; }
  .tab-bar {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: none;
    color: var(--sub-text);
    font-size: 0.85rem;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--primary); font-weight: bold; }
  .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 9px;
    background: var(--border);
    color: var(--text);
    font-size: 0.7rem;
  }
  .tab-btn.active .tab-count { background: var(--primary); color: #fff; }
  ul { padding: 0; margin: 0; }
  .empty { color: var(--sub-text); text-align: center; margin-top: 40px; }
  .answer-row, .summary-row {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fff;
  }
  .answer-row.readonly { background: var(--bg); }
  .answer-row.choice-ok, .summary-row.choice-ok { background: #F3FAF6; border-color: #CFEBDB; }
  .answer-row.choice-maybe, .summary-row.choice-maybe { background: #FFFBF0; border-color: #F5E3BC; }
  .answer-row.choice-ng, .summary-row.choice-ng { background: #FDF4F3; border-color: #F3D6D3; }
  .summary-row-collapsed { margin-bottom: 10px; }
  .summary-row-collapsed > summary { font-size: 0.85rem; color: var(--sub-text); cursor: pointer; padding: 8px 0; }
  .summary-row-collapsed .summary-row { margin-bottom: 0; }
  .option-meta { margin-bottom: 10px; }
  .option-meta-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .option-meta-title { font-weight: bold; font-size: 0.95rem; }
  .edit-option-btn {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 2px 4px;
  }
  .option-edit-form { margin-top: 8px; }
  #event-header-edit input,
  #event-header-edit textarea {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
  }
  #event-header-edit input:first-child,
  #event-header-edit textarea:first-child { margin-top: 0; }
  .option-edit-actions { display: flex; gap: 8px; margin-top: 8px; }
  .option-edit-actions .btn { flex: 1; width: auto; margin-top: 0; }
  .option-meta-info-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
    margin-top: 2px;
  }
  .option-meta-info-row-split { justify-content: space-between; }
  .option-meta-date, .option-meta-location { color: var(--sub-text); font-size: 0.8rem; }
  .option-meta-location { min-width: 0; overflow-wrap: anywhere; }
  .date-pill {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    background: #eef1f6;
    color: var(--sub-text);
    vertical-align: middle;
  }
  .date-pill-urgent { background: #fdeaea; color: #c0392b; }
  .option-comment {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 8px;
    padding: 6px 10px;
    background: var(--bg);
    border-radius: 8px;
  }
  .option-comment-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .comment-list-more { margin-top: 4px; }
  .comment-list-more summary { font-size: 0.7rem; color: var(--sub-text); cursor: pointer; }
  .option-comment-author { font-size: 0.7rem; color: var(--sub-text); }
  .option-comment-text { font-size: 0.9rem; word-break: break-word; }
  .comment-delete-btn {
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--sub-text);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .comment-add-toggle {
    border: none;
    background: none;
    color: var(--sub-text);
    font-size: 0.75rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
  }
  .comment-add-form { display: flex; gap: 6px; margin-top: 8px; }
  .comment-add-form[hidden] { display: none; }
  .comment-input {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .comment-count { color: var(--sub-text); }
  .answer-choices { display: flex; gap: 10px; }
  .respondent.me span:last-child { font-weight: bold; }
  details summary { font-size: 0.8rem; color: var(--sub-text); cursor: pointer; }
  .summary-answer-row { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .summary-answer-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-left: auto; }
  .summary-comment-row { display: flex; align-items: center; gap: 8px; }
  .answer-buttons { display: flex; gap: 10px; }
  .choice-count-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .choice-count { font-size: 0.75rem; color: var(--sub-text); font-weight: bold; }
  .remind-btn { flex-shrink: 0; padding: 6px 12px; font-size: 0.75rem; }
  .page-header-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .page-header-top-actions { display: flex; align-items: center; gap: 4px; }
  .btn-refresh {
    border: none;
    background: none;
    color: var(--sub-text);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 2px 4px;
  }
  .page-header-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .page-header-title-row h1 { flex: 1; min-width: 0; }
  .status-pill { flex-shrink: 0; padding: 3px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: bold; }
  .status-pill-creator { background: #EAF0FE; color: #4F46E5; }
  .status-pill-editor { background: #F0F0F0; color: var(--sub-text); }
  .editors-count-btn {
    flex-shrink: 0;
    border: none;
    background: #F0F0F0;
    color: var(--sub-text);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: bold;
    cursor: pointer;
  }
  .cal-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: var(--sub-text);
    text-decoration: none;
    width: fit-content;
  }
  .cal-link:hover { color: var(--text); }
  .loading, .error { text-align: center; color: var(--sub-text); margin-top: 40px; }
  .event-description { color: var(--sub-text); font-size: 0.9rem; white-space: pre-wrap; }
  section { margin-bottom: 24px; }
  .respondent-label { font-size: 0.75rem; color: var(--sub-text); margin: 0 0 4px; }
  .respondent-group {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
  }
  .respondent-group:first-of-type { margin-top: 0; }
  .respondent-group.choice-ok { border-color: #BFE5D1; }
  .respondent-group.choice-maybe { border-color: #F0D9A6; }
  .respondent-group.choice-ng { border-color: #F5C6C0; }
  /* デフォルトは横スクロール。将来「可視範囲まで展開」に切り替える場合は
     .respondent-list.expanded { flex-wrap: wrap; overflow-x: visible; } を追加すればよい */
  .respondent-list {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .respondent-list.expanded { flex-wrap: wrap; overflow-x: visible; }
  .respondent-list .respondent { flex-shrink: 0; }
  .respondent { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; width: 48px; }
  .avatar-wrap { position: relative; display: inline-block; }
  .avatar-wrap[data-comment-toggle] { cursor: pointer; }
  .respondent-comment-popup {
    display: block;
    margin-top: 4px;
    padding: 4px 8px;
    background: var(--bg);
    border-radius: 6px;
    font-size: 0.65rem;
    color: var(--text);
    white-space: normal;
    max-width: 120px;
  }
  .respondent-comment-popup[hidden] { display: none; }
  .avatar-comment-badge {
    position: absolute;
    bottom: -3px;
    right: -3px;
    font-size: 0.7rem;
    line-height: 1;
  }
  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-color: var(--border);
    background-size: cover;
    background-position: center;
    color: var(--sub-text);
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .avatar-ok { border: 2px solid #2D8A4E; }
  .avatar-maybe { border: 2px solid #E8A33D; }
  .avatar-ng { border: 2px solid #D93025; }
  .empty-respondents { color: var(--sub-text); font-size: 0.8rem; margin: 4px 0; }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 40px; }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    opacity: 0.7;
  }
  .is-saving {
    color: transparent !important;
    position: relative;
    pointer-events: none;
  }
  .is-saving .btn-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    margin: -6px 0 0 -6px;
  }
  .loading-tip {
    max-width: 280px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--sub-text);
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 6px;
  }
  .choice-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid transparent;
    font-size: 1.3rem;
    font-weight: bold;
    cursor: pointer;
    color: var(--sub-text);
    background: var(--border);
    transition: transform 0.1s ease;
  }
  .choice-btn.selected { transform: scale(1.08); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .choice-btn.choice-ok { background: #E9F7EF; color: #2D8A4E; border-color: #BFE5D1; }
  .choice-btn.choice-ok.selected { background: #2D8A4E; border-color: #2D8A4E; color: #fff; }
  .choice-btn.choice-maybe { background: #FFF6E5; color: #C9862B; border-color: #F0D9A6; }
  .choice-btn.choice-maybe.selected { background: #E8A33D; border-color: #E8A33D; color: #fff; }
  .choice-btn.choice-ng { background: #FDEDEB; color: #D93025; border-color: #F5C6C0; }
  .choice-btn.choice-ng.selected { background: #D93025; border-color: #D93025; color: #fff; }
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
  .cal-month-label { font-weight: bold; min-width: 90px; text-align: center; }
  .cal-grid-header, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-weekday { text-align: center; font-size: 0.7rem; color: var(--sub-text); padding: 4px 0; }
  .cal-cell {
    aspect-ratio: 1;
    min-height: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border-radius: 8px;
    cursor: default;
  }
  .cal-cell.has-items { cursor: pointer; background: var(--bg); }
  .cal-cell.today .cal-daynum {
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-daynum { font-size: 0.8rem; }
  .cal-pills { display: flex; flex-direction: column; gap: 1px; align-items: center; min-height: 12px; }
  .cal-pill {
    font-size: 0.5rem;
    line-height: 1.4;
    padding: 0 3px;
    border-radius: 5px;
    background: var(--border);
    color: var(--text);
    white-space: nowrap;
  }
  .cal-pill.dot-ok { background: #E9F7EF; color: #2D8A4E; }
  .cal-pill.dot-maybe { background: #FFF6E5; color: #C9862B; }
  .cal-pill.dot-ng { background: #FDEDEB; color: #D93025; }
  .cal-pill.dot-none { background: #EEEEEE; color: #8C8C8C; }
  .cal-pill-more { font-size: 0.5rem; color: var(--sub-text); }
  .cal-item-list { margin-top: 8px; }
  .cal-item {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  .cal-status-badge {
    font-size: 0.7rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cal-status-badge.badge-ok { background: #E9F7EF; color: #2D8A4E; }
  .cal-status-badge.badge-maybe { background: #FFF6E5; color: #C9862B; }
  .cal-status-badge.badge-ng { background: #FDEDEB; color: #D93025; }
  .cal-status-badge.badge-none { background: #EEEEEE; color: #8C8C8C; }
  .cal-item-status { font-size: 0.75rem; color: var(--sub-text); flex-shrink: 0; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-box {
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 16px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-close { border: none; background: none; font-size: 1.3rem; cursor: pointer; color: var(--sub-text); }
  .preview-scope-label { font-size: 0.75rem; color: var(--sub-text); margin: 4px 0 6px; }
  .preview-scope {
    border: 1px dashed #D8D6FA;
    border-radius: 14px;
    padding: 10px;
    background: #F7F7FF;
  }
  .flex-preview-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .preview-header-banner {
    padding: 10px 14px;
    font-weight: bold;
    background: var(--bg);
    color: var(--text);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .preview-header-banner strong { display: block; }
  #preview-header-label { display: block; font-weight: normal; font-size: 0.8rem; margin-top: 2px; }
  #preview-header-label:empty { display: none; }
  #preview-header-comment { display: block; font-weight: normal; font-size: 0.75rem; margin-top: 2px; opacity: 0.85; }
  #preview-header-comment:empty { display: none; }
  .flex-preview {
    padding: 12px;
    background: var(--bg);
  }
  .preview-chat-bubble {
    margin: 10px 0 0 auto;
    max-width: 75%;
    background: #06C755;
    color: #fff;
    padding: 8px 12px;
    border-radius: 14px 14px 2px 14px;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .flex-preview-line { margin: 4px 0; font-size: 0.85rem; }
  .flex-preview-title { font-weight: bold; font-size: 0.95rem; margin: 8px 0 4px; }
  .flex-preview-card { background: #F7F8FA; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .flex-preview-card .flex-preview-title { margin-top: 0; }
  .flex-preview-sep { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .flex-preview-answer { padding: 6px 8px; border-radius: 6px; }
  .flex-preview-answer.choice-ok { background: #E9F7EF; }
  .flex-preview-answer.choice-maybe { background: #FFF6E5; }
